org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Ensure Gradle uses the same JDK as Android Studio (more predictable TLS/certs on Windows).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Fix TLS downloads on Windows: avoid Windows-ROOT keystore type and use JDK cacerts.
systemProp.javax.net.ssl.trustStoreType=JKS
systemProp.javax.net.ssl.trustStore=C:\\Program Files\\Android\\Android Studio\\jbr\\lib\\security\\cacerts
systemProp.javax.net.ssl.trustStorePassword=changeit

# Workaround for Kotlin incremental cache failures on Windows when the project
# is on a different drive than the pub cache (e.g., D:\ project vs C:\ user).
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
