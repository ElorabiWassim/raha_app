name: ra7a
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  shared_preferences: ^2.0.15
  palette_generator: ^0.3.3+7
  lottie: ^3.1.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  flutter_rating_bar: ^4.0.1
  flutter_gen: ^5.12.0
  google_sign_in: ^6.3.0
  http: ^1.2.1
  dio: ^5.9.0
  image_picker: ^1.2.1
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^0.4.5+1
  path: ^1.9.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.25.8
  bloc_test: ^9.1.5
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/raha_app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/animations/
    - assets/bg/
