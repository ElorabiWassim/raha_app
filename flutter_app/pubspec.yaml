name: ra7a
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  palette_generator: ^0.3.3+7
  lottie: ^3.1.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  flutter_rating_bar: ^4.0.1  # moved here
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/animations/
    - assets/bg/
